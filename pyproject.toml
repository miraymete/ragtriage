[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragtriage"
version = "0.2.0"
description = "Measure RAG pipelines, compare configurations, and find out where the failures come from."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["rag", "evaluation", "information-retrieval", "llm", "turkish"]
dependencies = ["numpy>=1.26", "pydantic>=2.6", "pyyaml>=6", "typer>=0.12"]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3"]
# The adapter was checked against anthropic 2.6.
anthropic = ["anthropic>=2.6"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
ragtriage = "ragtriage.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ragtriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-3 flag the Turkish letter "ı" as a confusable "i". Here it is the point.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
# When the extra is installed, following it pulls in all of PyTorch and takes minutes.
follow_imports = "skip"

[[tool.mypy.overrides]]
# CI does not install the optional SDK. Skipping it keeps local and CI type checks the same.
module = ["anthropic", "anthropic.*"]
ignore_missing_imports = true
follow_imports = "skip"
